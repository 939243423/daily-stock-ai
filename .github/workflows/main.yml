name: Daily Stock AI Analysis

on:
  schedule:
    # 北京时间每天早上 09:05 运行 (UTC 01:05)
    # 这样可以确保在 09:15 集合竞价前完成分析
    # - cron: '5 1 * * 1-5'
    # - cron: '00 0 * * *'
    - cron: '42 13 * * *' 
  workflow_dispatch: # 允许你手动点击 "Run workflow" 测试

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    # 授予 Actions 推送代码的权限
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 关键修改：新增安装 yfinance 用于获取真实股价
          # 同时保留 google-genai 和 requests
          pip install -U google-genai requests yfinance

      - name: Run AI Analysis
        env:
          # 确保你在 Repository Secrets 中配置了 GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
        run: python analyze.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查文件是否有变化，防止没有数据更新时报错
          git add data/history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Daily Stock Recommendations: $(date +'%Y-%m-%d')"
            git push
          fi
