name: Daily Stock AI Analysis

on:
  schedule:
    # 北京时间每天早上 08:08 运行 (UTC 00:08)
    - cron: '42 22 * * *'
  workflow_dispatch: # 允许你手动点击 "Run workflow" 测试

jobs:
  analyze-and-deploy:
    runs-on: ubuntu-latest
    # 授予 Actions 推送代码的权限
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 关键修改：新增安装 yfinance 用于获取真实股价
          # 同时保留 google-genai 和 requests
          pip install -U google-genai requests yfinance

      - name: Run AI Analysis
        env:
        # 确保你在 Repository Secrets 中配置了 GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CHATANYWHERE_KEY: ${{ secrets.CHATANYWHERE_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python analyze.py

      # 1. 先把数据保存回 main 分支 (存档用)
      - name: Commit Data to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保添加的是 dist 下的数据
          git add dist/data/history.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Daily Stock Data: $(date +'%Y-%m-%d')"
            git push origin main
          fi

      # 2. [新增] 专门把 dist 文件夹发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # 关键：告诉它只发布 dist 文件夹里的内容
          force_orphan: true   # 每次都是干净的部署，防止历史记录膨胀