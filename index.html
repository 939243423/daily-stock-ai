<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 股市雷达</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index-dark.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* --- 核心修复：防止刷新出现乱码 --- */
        [v-cloak] {
            display: none !important;
        }

        /* --- 初始加载遮罩层 (Loading) --- */
        #global-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f8fafc; /* 白天背景 */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }
        /* 夜间模式 Loading 背景适配 */
        @media (prefers-color-scheme: dark) {
            #global-loader { background-color: #020617; } /* 如果系统默认是黑夜 */
        }
        /* 强制跟随 JS 逻辑 */
        html.dark #global-loader { background-color: #020617; }
        
        .loader-spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(99, 102, 241, 0.15);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Loading 文字样式 */
        .loader-text {
            margin-top: 16px;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.15em;
            font-family: -apple-system, "PingFang SC", sans-serif;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* --- 变量定义 --- */
        :root {
            --bg-body: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --btn-gradient: linear-gradient(to right, #4f46e5, #7c3aed); 
            --capsule-bg: rgba(255, 255, 255, 0.65);
        }

        html.dark {
            --bg-body: #020617;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            --btn-gradient: linear-gradient(to right, #6366f1, #a855f7);
            --capsule-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            transition: background-color 0.5s, color 0.5s;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .title-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* --- 日期选择器深度定制 --- */
        .custom-picker .el-input__wrapper {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
        }
        .custom-picker .el-input__inner {
            color: var(--text-primary) !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            font-family: "PingFang SC", monospace;
            text-align: center !important;
            height: 32px !important;
            line-height: 32px !important;
            letter-spacing: 0.02em;
        }
        .custom-picker .el-input__prefix, .custom-picker .el-input__suffix { display: none; }

        /* --- 控制栏胶囊 --- */
        .control-capsule {
            background: var(--capsule-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 99px;
            padding: 4px 4px 4px 16px; 
            display: inline-flex;
            align-items: center;
            gap: 8px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
        }
        .control-capsule:hover { transform: translateY(-1px); border-color: #6366f1; }

        /* --- 渐变按钮 --- */
        .gradient-btn {
            background: var(--btn-gradient) !important;
            border: none !important;
            color: white !important;
            font-weight: 700;
            font-size: 13px !important; 
            padding: 0 24px !important;  
            height: 34px !important;     
            border-radius: 99px !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            transition: all 0.3s !important;
        }
        .gradient-btn:hover { box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); transform: scale(1.02); }

        /* --- 卡片 --- */
        .stock-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            min-height: 540px; 
            height: auto;      
            transition: all 0.3s;
            position: relative;
            cursor: pointer;
        }
        .stock-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.8);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
        }
        .stock-card:active { transform: translateY(-2px) scale(0.99); }

        .reason-box { flex: 1; margin: 20px 0; }
        .reason-text { font-size: 15px; line-height: 1.75; color: var(--text-secondary); font-style: italic; text-align: justify; }

        .card-footer { margin-top: auto; padding-top: 20px; border-top: 1px dashed var(--card-border); }
        .tag-pill { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }

        .theme-float-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 50;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }
        .theme-float-btn:hover { background: rgba(99,102,241,0.1); transform: rotate(15deg); }

        .external-link-icon {
            position: absolute;
            top: 28px;
            right: 28px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            color: #6366f1;
        }
        .stock-card:hover .external-link-icon { opacity: 1; transform: translate(2px, -2px); }

        [v-cloak] { display: none !important; }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-spinner"></div>
    <p class="loader-text">AI 引擎初始化中...</p>
</div>

<div id="app" v-cloak class="min-h-screen w-full flex flex-col items-center py-10 px-6">
    
    <el-config-provider :locale="locale">
        
        <button @click="toggleTheme" class="theme-float-btn shadow-sm">
            <span v-if="isDark">🌙</span><span v-else>☀️</span>
        </button>

        <header class="text-center flex-shrink-0 animate-fade-in-up mb-8">
            <h1 class="text-4xl md:text-6xl mb-3 main-title title-gradient">AI 股市雷达</h1>
            <p class="text-xs font-bold tracking-[0.4em] uppercase opacity-40" style="color: var(--text-secondary)">
                Quant Analysis • Gemini 3 Pro
            </p>
        </header>

        <div class="flex justify-center mb-10 flex-shrink-0 animate-fade-in-up" style="animation-delay: 0.1s;">
            <div class="control-capsule">
                <div class="flex items-center">
                    <span class="text-xs font-bold uppercase tracking-widest opacity-60 whitespace-nowrap" style="color: var(--text-secondary); transform: scale(0.9);">
                        观测日期
                    </span>
                    <el-date-picker
                        v-model="selectedDate"
                        type="date"
                        value-format="YYYY-MM-DD"
                        format="YYYY年MM月DD日"
                        :clearable="false"
                        :editable="false"
                        class="custom-picker"
                        style="width: 135px;" 
                        @change="fetchData"
                        popper-class="glass-popper"
                    ></el-date-picker>
                </div>
                <div class="w-px h-3 bg-gray-400/30 hidden md:block"></div>
                <el-button class="gradient-btn" :loading="loading" @click="fetchData" round>
                    同步策略
                </el-button>
            </div>
        </div>

        <div v-if="stocks.length" class="w-full max-w-7xl animate-fade-in-up" style="animation-delay: 0.2s;">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-stretch">
                <div v-for="stock in stocks" :key="stock.code" class="stock-card group" @click="goToQuote(stock.code)" title="点击查看雪球实时行情">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 external-link-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25" />
                    </svg>

                    <div class="flex gap-2 mb-4">
                        <span class="tag-pill bg-blue-500/10 text-blue-600 dark:text-blue-400">沪深主板</span>
                        <span class="tag-pill bg-amber-500/10 text-amber-600 dark:text-amber-400">主力异动</span>
                        <span class="tag-pill bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">低估值</span>
                    </div>
                    
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <h3 class="text-3xl font-black tracking-tight group-hover:text-indigo-500 transition-colors">{{ stock.name }}</h3>
                            <p class="font-mono text-sm font-bold opacity-50 tracking-widest mt-1 group-hover:text-indigo-400 transition-colors">{{ stock.code }}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] font-bold uppercase opacity-40 mb-1">AI 信心指数</div>
                            <div class="text-2xl font-black transition-colors duration-300" :style="{ color: getScoreColor(stock.score) }">
                                {{ stock.score }}%
                            </div>
                        </div>
                    </div>
                    
                    <el-progress 
                        :percentage="stock.score" 
                        :show-text="false" 
                        :stroke-width="4" 
                        :color="getScoreColor(stock.score)" 
                        class="opacity-90"
                    ></el-progress>

                    <div class="reason-box">
                        <p class="reason-text">“ {{ stock.reason }} ”</p>
                    </div>

                    <div class="card-footer">
                        <div class="flex gap-2 items-start">
                            <span class="relative flex h-2 w-2 mt-1.5 flex-none">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                            </span>
                            <p class="text-[11px] leading-relaxed opacity-60 font-medium">
                                <span class="font-bold mr-1 text-red-500/80">风险:</span>{{ stock.risk }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div v-else class="flex-1 flex flex-col items-center justify-center opacity-40 min-h-[400px]">
            <el-empty description="AI 策略生成中..." :image-size="140"></el-empty>
        </div>

        <footer class="text-center text-[10px] uppercase tracking-[0.2em] opacity-30 font-bold mt-12 pb-4">
            &copy; 2026 AI Radar • Powered by DeepSeek & Gemini
        </footer>

    </el-config-provider>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/element-plus/dist/locale/zh-cn.min.js"></script>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const locale = ElementPlusLocaleZhCn;
            const isDark = ref(false);
            const selectedDate = ref(new Date().toISOString().split('T')[0]);
            const stocks = ref([]);
            const loading = ref(false);

            const toggleTheme = () => {
                isDark.value = !isDark.value;
                document.documentElement.className = isDark.value ? 'dark' : '';
            };

            const getScoreColor = (score) => {
                if (score >= 90) return '#8b5cf6';
                if (score >= 80) return '#3b82f6';
                if (score >= 70) return '#10b981';
                if (score >= 60) return '#f59e0b';
                return '#ef4444';
            };

            const goToQuote = (code) => {
                let market = 'SH';
                if (code.startsWith('6') || code.startsWith('9')) { market = 'SH'; } 
                else if (code.startsWith('0') || code.startsWith('2') || code.startsWith('3')) { market = 'SZ'; } 
                else if (code.startsWith('4') || code.startsWith('8')) { market = 'BJ'; }
                window.open(`https://xueqiu.com/S/${market}${code}`, '_blank');
            };

            const fetchData = async () => {
                loading.value = true;
                try {
                    const res = await fetch(`data/history.json?t=${Date.now()}`);
                    if(!res.ok) throw new Error("No Data");
                    const allData = await res.json();
                    stocks.value = allData[selectedDate.value]?.stocks || [];
                } catch (e) {
                    stocks.value = [];
                } finally {
                    loading.value = false;
                }
            };

            onMounted(() => {
                // 移除 Loading
                setTimeout(() => {
                    const loader = document.getElementById('global-loader');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 500);
                    }
                }, 400);

                fetchData();

                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
                    .animate-fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
                `;
                document.head.appendChild(style);
            });

            return { selectedDate, stocks, loading, isDark, toggleTheme, fetchData, locale, getScoreColor, goToQuote };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
